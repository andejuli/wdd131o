<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <style>
        /* all sibling that come after */
        p:last-child {
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <div>
        <h1>This is the main title</h1>
        <p>This is the main paragraph after the h1.</p>
        <section>
            <p>The paragraph inside the section.</p>
        </section>
        <p>This is the follow-up paragraph</p>
    </div>
</body>
</html>
